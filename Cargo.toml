[package]
name = "masqr"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Wiuvel"]
description = "A purpose-built MASQUE/WARP tunnel core for Windows"

# The library is where the core lives; the binary is the command line over it. The split is what
# lets the tests reach the parts worth testing without going through a process.
[lib]
name = "masqr"
path = "src/lib.rs"

[[bin]]
name = "masqr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }

# The registration calls are ordinary JSON over HTTPS. reqwest looks heavy for four requests, but
# its tree is hyper + h2 + rustls + tokio — the same crates the MASQUE leg needs on its own, so it
# costs almost nothing that is not paid already.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "http2",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The registration key pair is curve25519 (WireGuard's), because that is the shape the first
# /reg call accepts; the MASQUE key enrolled afterwards is P-256.
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"

# The HTTP/2 leg: TLS with a client certificate, HTTP/2, and the capsule stream inside it.
# `ring` rather than the default provider, to match the one crypto backend the project already
# ships in its helper service.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
h2 = "0.4"
http = "1"
bytes = "1"
# The client certificate is self-signed with the enrolled P-256 key; the server's is parsed only to
# compare its public key against the one the registration enrolled.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

# The HTTP/3 leg: QUIC with its datagram extension, on the same rustls and ring as the HTTP/2 one.
# HTTP/3 itself is written here (transport/http3.rs, qpack.rs): the one request this core sends is
# not one the h3 crate can express, and the subset it needs is small.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# For the connection id generator, which quinn does not re-export: the endpoint wants 20 bytes.
quinn-proto = { version = "0.11", default-features = false }

base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

# The adapter side: loading wintun.dll, and the IP Helper calls that give the adapter its address,
# its MTU and its routes. Linking these beats spawning `netsh`, which costs about a second per call
# and reports failure as text.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
